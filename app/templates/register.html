{% extends "base.html" %}
{% block content %}

<style>
.auth-section {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 15px;
    background: linear-gradient(135deg, #eef2f3, #dfe9f3);
}

.auth-card {
    width: 100%;
    max-width: 460px;
    border: none;
    border-radius: 18px;
    overflow: hidden;
}

.auth-header {
    background: linear-gradient(120deg, #198754, #43cea2);
    color: white;
    text-align: center;
    padding: 12px 16px;   /* 🔽 reduced height */
}

.auth-body {
    padding: 28px;
    background: white;
}

.form-control {
    border-radius: 4px;
    padding: 6px 10px;   /* 🔽 reduced height */
    font-size: 14px;     /* optional: slightly smaller text */
}

.form-control:focus {
    box-shadow: none;
    border-color: #198754;
}

.btn-auth {
    border-radius: 10px;
    padding: 10px;
    font-weight: 600;
}

.auth-footer-text {
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
}

.field-note {
    font-size: 12px;
    color: #6c757d;
    margin-top: 5px;
}

.invalid-feedback {
    display: none;
    font-size: 13px;
}

.was-validated .form-control:invalid {
    border-color: #dc3545;
}

.was-validated .form-control:invalid ~ .invalid-feedback {
    display: block;
}
</style>

<div class="auth-section">
    <div class="card shadow auth-card">

        <div class="auth-header">
            <h3 class="mb-1">Create Account</h3>
            <p class="mb-0" style="font-size: 14px;">
                Register to access the system
            </p>
        </div>

        <div class="auth-body">
            <form method="POST" novalidate id="registerForm">

                <div class="mb-3">
                    <label>Username</label>
                    <input type="text"
                           class="form-control"
                           name="username"
                           value="{{ username or '' }}"
                           required>
                    <div class="invalid-feedback">
                        Please enter your username.
                    </div>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email"
                           class="form-control"
                           name="email"
                           value="{{ email or '' }}"
                           required>
                    <div class="field-note">
                        Example: name@example.com
                    </div>
                    <div class="invalid-feedback">
                        Please enter a valid email address.
                    </div>
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input type="password"
                           class="form-control"
                           name="password"
                           minlength="6"
                           required>
                    <div class="field-note">
                        Minimum 6 characters required
                    </div>
                    <div class="invalid-feedback">
                        Password must be at least 6 characters.
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-auth w-100">
                    Register
                </button>

            </form>

            <div class="auth-footer-text">
                Already have an account?
                <a href="{{ url_for('auth.login') }}">Login</a>
            </div>

        </div>
    </div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function (event) {
    const form = this;

    if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
    }

    form.classList.add("was-validated");
});
</script>

{% endblock %}
